<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIO | المستخدمون</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="admin"><header><a class="brand" href="/app"><span class="logo sm">R</span> RIO</a><a href="/app">← العودة للمحادثة</a></header><h1>إدارة المستخدمين</h1><p class="muted">أنشئ الحسابات وحدد صلاحياتها.</p><div class="admin-grid"><form id="create" class="panel"><h2>إضافة مستخدم</h2><label>اسم المستخدم<input name="username" minlength="3" maxlength="40" required></label><label>كلمة المرور<input name="password" type="password" minlength="10" required></label><label>الصلاحية<select name="role"><option value="writer">كاتب</option><option value="reader">قارئ</option><option value="admin">مدير</option></select></label><button class="primary wide">إنشاء الحساب</button><p id="status"></p></form><section class="panel"><h2>الحسابات الحالية</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>الصلاحية</th><th>حذف</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.username}}</td><td><select class="role" data-id="{{u.id}}" {% if u.id==user.id %}disabled{% endif %}><option value="admin" {% if u.role=='admin' %}selected{% endif %}>مدير</option><option value="writer" {% if u.role=='writer' %}selected{% endif %}>كاتب</option><option value="reader" {% if u.role=='reader' %}selected{% endif %}>قارئ</option></select></td><td><button class="danger" data-delete="{{u.id}}" data-name="{{u.username}}" {% if u.id==user.id %}disabled{% endif %}>حذف</button></td></tr>{% endfor %}</tbody></table></div></section></div></main><script>
const st=document.getElementById('status');document.getElementById('create').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password'),role:f.get('role')})}),d=await r.json();st.textContent=r.ok?'تم إنشاء الحساب.':d.error;if(r.ok)setTimeout(()=>location.reload(),700)};
document.querySelectorAll('.role').forEach(x=>x.onchange=async()=>{let r=await fetch('/api/admin/users/'+x.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:x.value})}),d=await r.json();if(!r.ok){alert(d.error);location.reload()}});
document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=async()=>{if(confirm('حذف '+x.dataset.name+' وسجل محادثاته؟')){let r=await fetch('/api/admin/users/'+x.dataset.delete,{method:'DELETE'}),d=await r.json();if(!r.ok)alert(d.error);else location.reload()}});
</script></body></html>
